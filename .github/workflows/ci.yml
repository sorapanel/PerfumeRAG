name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # torchはデフォルトだとGPU向けCUDAビルドが入り数GB単位で肥大化する。
      # Dockerfile.mcpと同じ理由でCPU専用ビルドを先に固定する。
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 埋め込みモデル(intfloat/multilingual-e5-base)のダウンロードをrun間でキャッシュする。
      # 初回のみHuggingFaceから実際にダウンロードされ、以降のCIはキャッシュから復元される。
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-base

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # fly.toml の [build] dockerfile = 'Dockerfile.mcp' に従って
      # MCPサーバー専用イメージだけがビルド・デプロイされる（Django API側には触らない）。
      - name: Deploy MCP server to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
