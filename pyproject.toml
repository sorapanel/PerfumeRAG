[project]
name = "perfume-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "django>=5.0",
    "djangorestframework>=3.15.0",
    "gunicorn>=22.0.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perfume_rag"]

[tool.ruff.lint]
# ruffのデフォルト(E4/E7/E9/F = 正しさ系)に、import整列(I)と型注釈の有無(ANN)を追加する。
# ANNはCLAUDE.mdの「型ヒントを必ず付ける」という規約をCIで機械的に強制するためのもの。
# 行長(E501)は意図的に外している: CLAUDE.mdに行長の規約が無く、日本語コメントが多いこの
# コードベースに後付けで強制すると、規約外の理由で既存コードを書き換えることになるため。
select = ["E4", "E7", "E9", "F", "I", "ANN"]

[tool.ruff.lint.per-file-ignores]
# テストは「何を検証するか」が主眼で、戻り値は常にNone。ANN201の指摘は騒音にしかならない。
"tests/*" = ["ANN201"]
